name: roboshop
services:
  mongodb:
    build: ./mongodb
    image: manigangisetty/mongodb:v3 # docker build -t joindevops/mongodb:4.0.0
    container_name: mongodb # docker run -d --network roboshop joindevops/mongodb:4.0.0
    volumes:
    - mongodb:/data/db # mongodb stores data in /data/db directory
  catalogue:
    build: ./catalogue
    image: manigangisetty/catalogue:v3
    container_name: catalogue
    depends_on:
    - mongodb
  frontend:
    build: ./frontend
    image: manigangisetty/frontend:v3
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart

  user:
    build: ./user
    image: manigangisetty/user:v4
    container_name: user
    environment:
      MONGO: true
      REDIS_URL: 'redis://redis:6379'
      MONGO_URL: "mongodb://mongodb:27017/users"
  cart:
    build: ./cart
    image: manigangisetty/cart:v4
    container_name: cart
    environment:
      REDIS_HOST: redis
      CATALOGUE_HOST: catalogue
      CATALOGUE_PORT: 8080

    depends_on:
    - redis
    - catalogue

  redis:
    image: redis:7
    container_name: redis
    
  mysql:
    build: ./mysql
    image: manigangisetty/mysql:v4
    container_name: mysql
    command: --mysql-native-password=ON --innodb-lock_wait_timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: "Roboshop@1"



networks:
  default: # this means all the services in this file use this network
    name: roboshop
    driver: bridge
    external: false # if true it should be created manually, if false docker creates this network
volumes:
  mongodb: # docker volume create mongodb
  redis: # docker volume create redis 
  mysql: # docker volume create mysql








  













    






